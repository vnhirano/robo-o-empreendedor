# Este arquivo diz ao GitHub QUANDO e COMO rodar o robô.
name: Robo O Empreendedor

on:
  schedule:
    - cron: "7 * * * *"      # todo hora, no minuto 7 (o robô ignora fora do horário definido no config.py)
  workflow_dispatch:          # permite rodar na mão pelo botão "Run workflow"
    inputs:
      modo:
        description: "rascunho (vai para os rascunhos do Buffer) ou publicar"
        default: "rascunho"
      formato:
        description: "auto (sorteia), texto, imagem ou video"
        default: "auto"
      forcar:
        description: "sim = roda mesmo fora do horário (para testes)"
        default: "nao"

permissions:
  contents: write             # para salvar o histórico de notícias já postadas

concurrency:
  group: robo
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar ffmpeg e bibliotecas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt

      - name: Rodar o robô
        env:
          MODO: ${{ github.event.inputs.modo || vars.MODO || 'rascunho' }}
          FORCAR: ${{ github.event.inputs.forcar || 'nao' }}
          FORMATO: ${{ github.event.inputs.formato || 'auto' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
        run: python -m bot.main

      - name: Salvar histórico
        if: always()
        run: |
          git config user.name "robo-o-empreendedor"
          git config user.email "robo@users.noreply.github.com"
          git add data/postados.json
          git diff --cached --quiet || (git commit -m "histórico de posts" && git push)
